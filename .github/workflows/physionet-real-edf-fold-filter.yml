name: Frozen real PhysioNet EEGBCI EDF fold-filter dependence

on:
  push:
    branches:
      - "research/physionet-edf-fold-filter-20261013"
    paths:
      - "research/PHYSIONET_EDF_FOLD_FILTER_PREREG_20261013.json"
      - "research/physionet_real_edf_filter_dependence.py"
      - ".github/workflows/physionet-real-edf-fold-filter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-public-eeg-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raw EDF, fixed SciPy SOS and numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scipy>=1.11,<2" "mne>=1.8,<2"
      - name: Obtain ONLY registered PhysioNet original EDF files
        env:
          PYTHONUNBUFFERED: "1"
          MNE_DONTWRITE_HOME: "true"
        run: |
          set -o pipefail
          python -m research.physionet_real_edf_filter_dependence --cache /tmp/original_eegbci_edf --out physionet_real_eegbci_filter_perturbation.json 2>&1 | tee real_public_eeg_source_experiment.log
          test -s physionet_real_eegbci_filter_perturbation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-physionet-edf-filter-original-results
          path: |
            physionet_real_eegbci_filter_perturbation.json
            real_public_eeg_source_experiment.log
