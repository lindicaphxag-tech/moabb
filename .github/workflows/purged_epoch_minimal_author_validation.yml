name: Fork-only minimal raw epoch purge validation

on:
  push:
    branches: [fix/minimal-raw-epoch-purge-20261025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable MOABB and pytest
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9.1"
      - name: Validate raw epoch split semantics and interval oracle
        run: |
          python -m pytest -q moabb/tests/test_purged_epoch_minimal.py
