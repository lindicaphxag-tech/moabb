name: Focused raw-epoch purge CV contract

on:
  push:
    branches:
      - review/minimal-purged-epoch-cv-core-20261009
  pull_request:
    paths:
      - "moabb/evaluations/splitters.py"
      - "moabb/tests/test_purged_epoch_core_only.py"
      - ".github/workflows/purged-epoch-core-fast.yml"

permissions:
  contents: read

jobs:
  exact-core-regression:
    name: focused purge / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MOABB and focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . "pytest>=8,<9.1"
      - name: Run ONLY new raw epoch CV contract and independent randomized oracle
        run: |
          python -m pytest -q moabb/tests/test_purged_epoch_core_only.py
