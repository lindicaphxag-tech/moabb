name: Independent fresh-download PhysioNet real EEG source audit
on:
  push:
    branches:
      - "research/physionet-edf-fold-filter-20261013"
    paths:
      - "research/audit_physionet_real_edf_filter_dependence.py"
      - ".github/workflows/physionet-independent-real-edf-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-public-edf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scipy>=1.11,<2" "mne>=1.8,<2"
      - name: Download original prospectively frozen study results
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38336887369
          pattern: real-physionet-edf-filter-original-results
          merge-multiple: true
          path: /tmp/physionet_original_experiment
      - name: Independently redownload all original source EDF files and replay linearity
        env:
          PYTHONUNBUFFERED: "1"
          MNE_DONTWRITE_HOME: "true"
        run: |
          set -o pipefail
          python -m research.audit_physionet_real_edf_filter_dependence --original /tmp/physionet_original_experiment/physionet_real_eegbci_filter_perturbation.json --cache /tmp/new_untouched_edf_audit --out verified_physionet_original_edf.json 2>&1 | tee independently_replayed_eeg_source.log
          test -s verified_physionet_original_edf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-replayed-physionet-original-edf-evidence
          path: |
            verified_physionet_original_edf.json
            independently_replayed_eeg_source.log
