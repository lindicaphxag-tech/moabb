name: True new-subject PhysioNet EEG decision certificate validation
on:
  push:
    branches: ["research/decision-aware-eeg-convex-certificate-20261013"]
    paths:
      - "research/physionet_prospective_decision_certificate.py"
      - "research/PHYSIONET_PROSPECTIVE_DECISION_CERT_4_NEW_PREREG_20261013.json"
      - ".github/workflows/physionet-prospective-decision-certificate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-new-participant-eeg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scipy>=1.11,<2" "mne>=1.8,<2"
      - name: Run untouched real EDF on all registered S025-S028
        env:
          PYTHONUNBUFFERED: "1"
          MNE_DONTWRITE_HOME: "true"
        run: |
          set -o pipefail
          python -m research.physionet_prospective_decision_certificate --cache /tmp/real_new_subject_decision_cert --output original_4_new_subject_decision_certificate.json 2>&1 | tee original_4_new_subject_decision_certificate.log
          test -s original_4_new_subject_decision_certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-four-new-physionet-decision-cert-evidence
          path: |
            original_4_new_subject_decision_certificate.json
            original_4_new_subject_decision_certificate.log
