name: Validate isolated MOABB raw epoch CV core
on:
  push:
    branches: [review/minimal-purged-epoch-cv-core-20261009]
    paths:
      - 'moabb/evaluations/splitters.py'
      - 'moabb/tests/test_purged_epoch_core_only.py'
      - '.github/workflows/validate-minimal-purged-core.yml'
permissions:
  contents: read
jobs:
  stand-alone-splitter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact fork code as installed MOABB (not copied snippets)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Fail-closed raw interval and stratified time split tests
        run: |
          python -m pytest moabb/tests/test_purged_epoch_core_only.py -v --disable-warnings
      - name: Check only the intentional appended core plus standalone tests
        run: |
          git diff --check HEAD^ HEAD
          python -m compileall -q moabb/evaluations/splitters.py moabb/tests/test_purged_epoch_core_only.py
